<button
  type="button"
  [class]="
    'group relative flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-left transition-all duration-200 select-none ' +
    (isSelected()
      ? 'bg-[#ef0606] text-white shadow-md font-semibold'
      : 'text-slate-100 hover:bg-white/10 hover:text-white font-medium')
  "
  (click)="handleSelect()"
  [attr.title]="item().label"
>
  <!-- Active Indicator Bar -->
  @if (isSelected()) {
    <div class="absolute left-0 top-2 bottom-2 w-1.5 rounded-r-full bg-white"></div>
  }

  <!-- Icon Container -->
  <div
    [class]="
      'flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-base transition-colors duration-150 ' +
      (isSelected()
        ? 'bg-white text-[#ef0606]'
        : 'bg-white/10 text-white group-hover:bg-[#ef0606] group-hover:text-white')
    "
  >
    <i [class]="(item().icon || 'fa-solid fa-layer-group') + ' fa-font-solid'"></i>
  </div>

  <!-- Label & Subtitle -->
  @if (!isCollapsed()) {
    <div class="flex flex-1 flex-col overflow-hidden min-w-0">
      <div class="flex items-center justify-between gap-1.5">
        <span class="truncate text-xs font-bold tracking-tight">{{ item().label }}</span>
        @if (item().badge) {
          <span
            [class]="
              'rounded-full px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider ' +
              (isSelected() ? 'bg-white text-[#ef0606]' : 'bg-[#ef0606] text-white')
            "
          >
            {{ item().badge }}
          </span>
        }
      </div>
      <span
        [class]="
          'truncate text-[11px] font-normal ' +
          (isSelected() ? 'text-slate-100' : 'text-slate-300')
        "
      >
        {{ item().subtitle }}
      </span>
    </div>
  }
</button>
