spring:
  application:
    name: jhomeron-admin

  datasource:
    url: jdbc:postgresql://localhost:5432/jhomeron_batch
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    rest:
      base-path: /api
      return-body-on-create: true
      return-body-on-update: true

server:
  port: 8092

# Secreto compartido con backend/reporting (y a futuro ai/ml) para validar el
# JWT emitido en /api/auth/login sin llamar de vuelta a admin en cada request.
# DEV ONLY: en produccion esto viene de una variable de entorno real, nunca
# del valor por defecto de este archivo.
jwt:
  secret: ${JWT_SECRET:jhomeron-dev-secret-cambiar-en-produccion-32+chars}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas

# Development Profile Override
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:admin_db
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
