<div class="max-w-2xl mx-auto">
  <div class="flex items-center space-x-4 mb-8">
    <button routerLink=".." class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </button>
    <div>
      <h3 class="text-2xl font-bold text-slate-800 dark:text-white">Nuevo Usuario</h3>
      <p class="text-sm text-slate-500 mt-1">Completa los datos para dar de alta un usuario</p>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Nombre y Usuario -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Nombre Completo *</label>
          <input type="text" formControlName="name" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="Ej: Juan Pérez" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Nombre de Usuario *</label>
          <input type="text" formControlName="username" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="Ej: jperez" />
        </div>
      </div>

      <!-- Password y Rol -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Contraseña *</label>
          <input type="password" formControlName="password" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="••••••••" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Rol del Sistema *</label>
          <select formControlName="role" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow appearance-none">
            <option value="VENDEDOR">Vendedor</option>
            <option value="GERENCIA">Gerencia</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>
      </div>

      <!-- Área y Ubicación -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Área (Opcional)</label>
          <input type="text" formControlName="area" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="Ej: Ventas Sur" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Ubicación (Opcional)</label>
          <input type="text" formControlName="location" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="Ej: Arequipa" />
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Descripción / Notas (Opcional)</label>
        <textarea formControlName="description" rows="3" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="Información adicional sobre el usuario..."></textarea>
      </div>

      <div class="pt-6 border-t border-slate-100 dark:border-slate-700 flex justify-end space-x-4">
        <button type="button" routerLink=".." class="px-6 py-2.5 rounded-xl font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="userForm.invalid" class="px-6 py-2.5 rounded-xl font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:opacity-50 shadow-lg shadow-blue-500/30 transition-all transform hover:scale-105">
          Guardar Usuario
        </button>
      </div>
    </form>
  </div>
</div>
