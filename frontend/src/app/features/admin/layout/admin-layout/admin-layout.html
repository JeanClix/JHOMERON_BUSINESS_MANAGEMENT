<div class="min-h-screen bg-[#f8fafc] text-slate-900 flex font-outfit selection:bg-[#0d3393] selection:text-white">
  
  <!-- DESKTOP SIDEBAR -->
  <div class="hidden md:block shrink-0 h-screen sticky top-0 z-30">
    <app-sidebar
      [isCollapsed]="isSidebarCollapsed()"
      [navGroups]="adminNavGroups"
      moduleName="Admin"
      moduleIcon="fa-solid fa-users-cog"
      moduleRoute="/admin"
      (toggleCollapse)="toggleSidebarCollapse()"
    ></app-sidebar>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 flex flex-col min-w-0 h-screen bg-[#f8fafc] overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10 shrink-0">
      <h2 class="text-xl font-bold text-slate-800">Gestión del Sistema</h2>
    </header>

    <!-- Page Content -->
    <div class="flex-1 overflow-auto p-4 md:p-8 relative">
      <!-- Decorative background blur -->
      <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-blue-400/10 blur-3xl mix-blend-multiply pointer-events-none"></div>
      
      <div class="relative z-10 h-full">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
