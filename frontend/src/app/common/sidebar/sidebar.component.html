<aside [class]="
    'flex h-full flex-col justify-between bg-[#0d3393] p-4 text-white transition-all duration-300 select-none shadow-xl border-r border-[#0b2670] ' +
    (isCollapsed() ? 'w-20' : 'w-72')
  ">
  <!-- Header & Brand Logo for Internal Vendor Portal -->
  <div>
    <div class="mb-5 flex items-center justify-between px-2 pt-1">
      <div class="flex items-center gap-3 overflow-hidden">

        <!-- Logo -->
        <div class="flex h-10 shrink-0 items-center justify-center">
          <img src="logo-white.png" alt="Logo JHOMERON" class="h-10 object-contain">
        </div>

      </div>

      <button type="button" (click)="onToggleCollapse()"
        class="hidden md:flex h-7 w-7 items-center justify-center rounded-lg bg-white/10 text-white hover:bg-[#ef0606] transition-colors"
        [title]="isCollapsed() ? 'Expandir barra lateral' : 'Colapsar barra lateral'">
        <i [class]="'fa-solid text-xs ' + (isCollapsed() ? 'fa-chevron-right' : 'fa-chevron-left')"></i>
      </button>
    </div>

    <!-- Navigation Section Title -->
    @if (!isCollapsed()) {
    <div class="px-3 mb-2 flex items-center justify-between">
      <span class="text-[11px] font-bold uppercase tracking-wider text-slate-200 opacity-80">
        Herramientas de Venta
      </span>
      <span class="text-[9px] font-bold text-white bg-[#ef0606] px-2 py-0.5 rounded shadow-xs">INTERNO</span>
    </div>
    }

    <!-- Sidebar Navigation List -->
    <nav class="space-y-1.5">
      @for (item of items(); track item.id) {
      <app-sidebar-item [item]="item" [isSelected]="item.id === selectedId()" [isCollapsed]="isCollapsed()"
        (select)="onItemSelect($event)"></app-sidebar-item>
      }
    </nav>
  </div>

  <!-- Footer Vendor Profile Card -->
  <div class="mt-auto pt-3 border-t border-white/10">
    @if (!isCollapsed()) {
    <div class="rounded-xl bg-white/10 p-3 border border-white/10 backdrop-blur-xs">
      <div class="flex items-center gap-3">
        <div
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-[#ef0606] text-white font-bold text-xs shadow-xs">
          <i class="fa-solid fa-user-tie fa-font-solid"></i>
        </div>
        <div class="flex flex-col min-w-0 flex-1">
          <span class="truncate text-xs font-bold text-white">Vendedor Comercial</span>
          <span class="truncate text-[11px] text-emerald-300 font-semibold flex items-center gap-1">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span> Asignado: Lima Norte
          </span>
        </div>
      </div>
    </div>
    } @else {
    <div class="flex justify-center">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#ef0606] text-white text-xs"
        title="Vendedor Comercial Conectado">
        <i class="fa-solid fa-user-tie fa-font-solid"></i>
      </div>
    </div>
    }
  </div>
</aside>
